<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Luxe Gifts LK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main>
  <div class="page static-page">
    <div class="container">
      <div class="static-hero">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you. Reach out for orders, custom requests, or support.</p>
      </div>
      <div class="content-block">
        <h2>Get in Touch</h2>
        <p><strong>Address:</strong> 42 Galle Road, Colombo 03, Sri Lanka</p>
        <p><strong>Phone:</strong> +94 77 123 4567 (7 days a week, 9 AM – 8 PM)</p>
        <p><strong>Email:</strong> hello@luxegifts.lk</p>
        <p><strong>WhatsApp:</strong> +94 77 123 4567</p>
        <div class="form-group" style="margin-top:32px"><label>Your Name</label><input type="text" placeholder="Nimal Perera"></div>
        <div class="form-group"><label>Email</label><input type="email" placeholder="you@example.com"></div>
        <div class="form-group"><label>Message</label><textarea rows="4" placeholder="How can we help?"></textarea></div>
        <button class="btn btn-primary" onclick="showToast('Thank you! We will get back to you shortly.')">Send Message</button>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
